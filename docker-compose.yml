x-casaos:
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/perplexity.svg
  title:
    custom: Perplexity WebUI Scraper
  index: /
  port_map: "8000"
  scheme: http

services:
  perplexity-api:
    image: ghcr.io/henrique-coder/perplexity-webui-scraper:latest
    pull_policy: always
    container_name: perplexity-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TZ: Europe/Dublin
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  perplexity-mcp:
    image: ghcr.io/henrique-coder/perplexity-webui-scraper:mcp
    pull_policy: always
    container_name: perplexity-mcp
    restart: unless-stopped
    environment:
      TZ: Europe/Dublin
      # Set this in ZimaOS (or .env) before starting the stack.
      PERPLEXITY_SESSION_TOKEN: ${PERPLEXITY_SESSION_TOKEN}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
