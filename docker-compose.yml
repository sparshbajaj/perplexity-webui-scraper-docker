services:
  perplexity-api:
    # ── Image ────────────────────────────────────────────────────────────
    # Replace YOUR_GITHUB_USERNAME with your GitHub username after forking.
    # This will auto-pull the latest image built by your GitHub Actions workflow.
    image: ghcr.io/YOUR_GITHUB_USERNAME/perplexity-webui-scraper:latest

    container_name: perplexity-api

    # ── Restart policy ───────────────────────────────────────────────────
    restart: unless-stopped

    # ── Port mapping ─────────────────────────────────────────────────────
    # Access the OpenAI-compatible API at http://<zima-ip>:8000
    # Change the left side (host port) if 8000 is already in use.
    ports:
      - "8000:8000"

    # ── Environment ──────────────────────────────────────────────────────
    # The session token is NOT required at startup; you pass it per-request
    # as the "Authorization: Bearer <token>" header instead.
    # Optionally set a default token here so you don't have to send it every time:
    environment:
      # PERPLEXITY_SESSION_TOKEN: "your_token_here"   # ← uncomment if desired
      TZ: Europe/Dublin

    # ── Health check ────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # ── Logging ─────────────────────────────────────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
