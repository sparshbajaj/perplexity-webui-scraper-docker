name: Build & Push Docker Image

on:
  push:
    branches:
      - prod
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  UPSTREAM_REPO: henrique-coder/perplexity-webui-scraper
  UPSTREAM_BRANCH: prod

jobs:
  build-and-push:
    name: Build and push API + MCP images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Select source for build
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "repository=${{ env.UPSTREAM_REPO }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ env.UPSTREAM_BRANCH }}" >> "$GITHUB_OUTPUT"
          else
            echo "repository=${{ github.repository }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image repository
        id: repo
        shell: bash
        run: echo "image_repo=${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (API)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.image_repo }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push Docker image (API)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Docker metadata (MCP)
        id: meta_mcp
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.image_repo }}
          tags: |
            type=raw,value=mcp
            type=sha,format=short,prefix=sha-,suffix=-mcp

      - name: Build and push Docker image (MCP)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile.mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_mcp.outputs.tags }}
          labels: ${{ steps.meta_mcp.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-mcp
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-mcp,mode=max
