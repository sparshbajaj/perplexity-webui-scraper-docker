name: Build & Push Docker Image

on:
  push:
    branches:
      - prod
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  UPSTREAM_REPO: henrique-coder/perplexity-webui-scraper
  UPSTREAM_BRANCH: prod

jobs:
  build-and-push:
    name: Build and push API + MCP images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Select source for build
        id: source
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "repository=${{ env.UPSTREAM_REPO }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ env.UPSTREAM_BRANCH }}" >> "$GITHUB_OUTPUT"
          else
            echo "repository=${{ github.repository }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.ref }}

      - name: Capture source commit
        id: sha
        shell: bash
        run: |
          echo "full_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image repository
        id: repo
        shell: bash
        run: |
          image_name="$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_repo=${{ env.REGISTRY }}/${image_name}" >> "$GITHUB_OUTPUT"

      - name: Check if commit image already exists
        id: existing
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          api_tag="sha-${{ steps.sha.outputs.short_sha }}"
          mcp_tag="sha-${{ steps.sha.outputs.short_sha }}-mcp"

          api_exists=false
          mcp_exists=false

          if docker buildx imagetools inspect "${{ steps.repo.outputs.image_repo }}:${api_tag}" >/dev/null 2>&1; then
            api_exists=true
          fi

          if docker buildx imagetools inspect "${{ steps.repo.outputs.image_repo }}:${mcp_tag}" >/dev/null 2>&1; then
            mcp_exists=true
          fi

          if [[ "${api_exists}" == "true" && "${mcp_exists}" == "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Image tags ${api_tag} and ${mcp_tag} already exist, skipping scheduled rebuild."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata (API)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.image_repo }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.sha.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ steps.source.outputs.repository }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.full_sha }}

      - name: Build and push Docker image (API)
        if: github.event_name != 'schedule' || steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.repo.outputs.image_repo }}:buildcache
          cache-to: type=registry,ref=${{ steps.repo.outputs.image_repo }}:buildcache,mode=max

      - name: Docker metadata (MCP)
        id: meta_mcp
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.image_repo }}
          tags: |
            type=raw,value=mcp
            type=raw,value=sha-${{ steps.sha.outputs.short_sha }}-mcp
          labels: |
            org.opencontainers.image.source=https://github.com/${{ steps.source.outputs.repository }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.full_sha }}

      - name: Build and push Docker image (MCP)
        if: github.event_name != 'schedule' || steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile.mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_mcp.outputs.tags }}
          labels: ${{ steps.meta_mcp.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.repo.outputs.image_repo }}:buildcache-mcp
          cache-to: type=registry,ref=${{ steps.repo.outputs.image_repo }}:buildcache-mcp,mode=max
