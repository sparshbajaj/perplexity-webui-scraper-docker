name: Build & Push Docker Image

on:
  # Auto-build whenever you publish a new GitHub Release
  release:
    types: [published]

  # Also allow manual runs from the Actions tab
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # e.g. ghcr.io/YOUR_GITHUB_USERNAME/perplexity-webui-scraper
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build multi-arch image and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. QEMU – enables arm64 builds on x86 runners ───────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── 3. Buildx – multi-platform builder ──────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Log in to GitHub Container Registry ───────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Derive image tags & labels ────────────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # On a release: tag with the version number AND "latest"
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            # On manual dispatch: tag as "manual"
            type=raw,value=manual,enable=${{ github.event_name == 'workflow_dispatch' }}

      # ── 6. Build & push ──────────────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Build for both amd64 (typical Zima OS / x86 NAS) and arm64
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in the GHCR registry to speed up future builds
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
